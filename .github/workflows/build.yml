name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev
          libxcursor-dev libxinerama-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNF_STATIC_RUNTIME=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test game logic
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test the renderer
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ./build/null-frequency --smoke-test
      - name: Stage portable package
        run: cmake --install build --config Release --component Game --prefix package/null-frequency
      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/null-frequency-linux-x86_64.tar.gz -C package null-frequency
      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path package/null-frequency -DestinationPath dist/null-frequency-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: null-frequency-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: null-frequency-*
          path: dist
          merge-multiple: true
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum dist/* | sed 's#dist/##' > dist/SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "NULL FREQUENCY $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
